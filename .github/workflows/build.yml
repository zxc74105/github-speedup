name: build

on:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: windows-x86_64
                      os: windows-latest
                      artifact: github-speedup-x86_64.exe
                      pyarch: x64
                    - name: windows-arm64
                      os: windows-11-arm
                      artifact: github-speedup-arm64.exe
                      pyarch: arm64
                    - name: linux-x86_64
                      os: ubuntu-latest
                      artifact: github-speedup-x86_64
                    - name: linux-arm64
                      os: ubuntu-24.04-arm
                      artifact: github-speedup-arm64
                    - name: macos
                      os: macos-latest
                      artifact: github-speedup-darwin

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  architecture: ${{ matrix.pyarch || 'x64' }}

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt pyinstaller

            - name: Build binary
              shell: bash
              run: |
                  if [ "${{ matrix.os }}" = "macos-latest" ]; then
                      export TARGET_ARCH=universal2
                  fi
                  pyinstaller --noconfirm --clean github-speedup.spec

            - name: Prepare artifacts
              shell: bash
              run: |
                  mkdir -p artifact
                  if [ "${{ matrix.os }}" = "macos-latest" ]; then
                      lipo -thin x86_64 -output artifact/github-speedup-darwin-x86_64 dist/github-speedup
                      lipo -thin arm64 -output artifact/github-speedup-darwin-arm64 dist/github-speedup
                  else
                      cp dist/github-speedup* artifact/${{ matrix.artifact }}
                  fi
                  ls -la artifact

            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.name }}
                  path: artifact
                  if-no-files-found: error
